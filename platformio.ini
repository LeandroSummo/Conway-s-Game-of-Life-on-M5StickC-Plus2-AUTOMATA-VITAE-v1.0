; ============================================================
;  PlatformIO — Conway's Game of Life — M5StickC Plus2
;  Target: ESP32-PICO-V3-02  |  8MB Flash  |  2MB PSRAM
; ============================================================

[platformio]
default_envs = m5stick-c-plus2

[env:m5stick-c-plus2]
platform          = espressif32
framework         = arduino
board             = m5stick-c-plus2          ; custom board in boards/m5stick-c-plus2.json
board_build.partitions = default_8MB.csv     ; 8MB partition scheme

monitor_speed     = 115200
monitor_filters   = esp32_exception_decoder, default
upload_speed      = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Os

lib_deps =
    m5stack/M5StickCPlus2       ; pulls in M5Unified + M5GFX

lib_ldf_mode = chain+           ; resolves transitive deps (M5GFX -> LovyanGFX, etc.)
lib_ignore    = DFRobot_GP8XXX  ; incompatible with esp32 arduino core 3.x, not needed here
